[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bingus-ia"
version = "0.1.0"
description = "Agentic AI programming assistant with Ollama"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "trafilatura>=1.6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
include = ["bingus_ia*"]
